<!DOCTYPE html>
<html>
<head>
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
    }
    h1 {
      color: darkblue;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hello, World! 🌍</h1>
  <p>This is my very first website.</p>
  <button onclick="sayHello()">Click Me</button>

  <script>
    function sayHello() {
      alert("You clicked the button! 🚀");
    }
  </script>
</body>
</html>
